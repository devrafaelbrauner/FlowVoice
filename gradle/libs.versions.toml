[versions]
agp = "8.10.1"
kotlin = "2.1.10"
composeBom = "2025.06.00"
activityCompose = "1.9.3"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
kotlinxSerialization = "1.7.3"
ktor = "2.3.13"
koin = "3.5.6"
